name: Publish cybercore to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.8.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Verify and publish crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches package version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "cybercore"))')"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          test "$RELEASE_VERSION" = "$VERSION"
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features
      - name: Package crate
        run: cargo package --locked
      - name: Check crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN" || { echo "Configure the CARGO_REGISTRY_TOKEN repository secret before publishing."; exit 1; }
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
