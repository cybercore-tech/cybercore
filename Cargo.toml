[package]
name = "cybercore"
version = "0.4.0"
edition = "2021"
description = "Shared config schema, palette, and path conventions for the Cybercore Systems Framework"
build = "build.rs"

[lib]
name = "cybercore"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"
